<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Baby Courtney Gender Prediction</title>

  <style>
    :root {
      --navy: #173f61;
      --text: #625853;
      --muted: #82766f;
      --boy: #2787c4;
      --boy-dark: #1479b9;
      --girl: #df7195;
      --girl-dark: #d95e88;
      --footer-border: #eee7e2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #fffaf7;
    }

    body {
      overflow: hidden;
    }

    .dashboard {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      flex: 0 0 auto;
      text-align: center;

      background:
        linear-gradient(
          90deg,
          rgba(219, 239, 255, 0.96),
          rgba(255, 255, 255, 0.98) 50%,
          rgba(255, 224, 235, 0.96)
        );

      padding: 14px 30px 12px;

      border-bottom:
        1px solid rgba(0, 0, 0, 0.05);
    }

    .baby-name {
      margin-bottom: 1px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--navy);

      font-size:
        clamp(20px, 1.8vw, 34px);
    }

    .title {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--navy);

      font-size:
        clamp(36px, 4vw, 70px);

      line-height: 1;
    }

    .subtitle {
      margin-top: 6px;

      color: #766b65;

      font-size:
        clamp(15px, 1.35vw, 24px);
    }

    /* MAIN */

    .vote-area {
      flex: 1 1 auto;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      min-height: 0;
    }

    .team {
      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 0;

      padding: 16px 28px;

      text-align: center;
    }

    /* BOY */

    .boy {
      background:
        radial-gradient(
          circle at 50% 30%,
          #f9fdff 0%,
          #e7f5ff 48%,
          #d2edff 100%
        );
    }

    .boy .team-label {
      color: var(--boy);
    }

    .boy .vote-count {
      color: var(--boy-dark);
    }

    .boy .progress {
      background: var(--boy);
    }

    /* GIRL */

    .girl {
      background:
        radial-gradient(
          circle at 50% 30%,
          #fffafd 0%,
          #fff0f5 48%,
          #ffdae7 100%
        );
    }

    .girl .team-label {
      color: var(--girl);
    }

    .girl .vote-count {
      color: var(--girl-dark);
    }

    .girl .progress {
      background: var(--girl);
    }

    /* BABY PHOTO CARDS */

    .baby-photo-card {
      display: flex;

      flex-direction: column;

      align-items: center;

      margin-bottom: 8px;
    }

    .baby-photo-frame {
      width:
        clamp(150px, 12vw, 225px);

      height:
        clamp(150px, 12vw, 225px);

      overflow: hidden;

      background: white;

      border:
        6px solid rgba(255, 255, 255, 0.96);

      border-radius: 50%;

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.13);
    }

    .baby-photo-frame img {
      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

      object-position:
        center 30%;
    }

    .baby-photo-label {
      margin-top: 8px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #716661;

      font-size:
        clamp(16px, 1.3vw, 24px);

      font-style: italic;
    }

    .boy .baby-photo-frame {
      box-shadow:
        0 10px 28px rgba(39, 135, 196, 0.22);
    }

    .girl .baby-photo-frame {
      box-shadow:
        0 10px 28px rgba(223, 113, 149, 0.26);
    }

    /* TEAM CONTENT */

    .team-label {
      font-size:
        clamp(28px, 2.5vw, 46px);

      font-weight: 700;

      letter-spacing: 4px;

      text-transform: uppercase;
    }

    .vote-count {
      margin: 10px 0 5px;

      font-size:
        clamp(80px, 9vw, 165px);

      font-weight: 800;

      line-height: 0.88;
    }

    .votes-label {
      color: #756d69;

      font-size:
        clamp(12px, 1vw, 18px);

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .percentage {
      margin-top: 6px;

      color: #504845;

      font-size:
        clamp(26px, 2.2vw, 40px);

      font-weight: 700;
    }

    /* PROGRESS */

    .progress-container {
      width:
        min(72%, 520px);

      height: 14px;

      margin-top: 12px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.82);

      border-radius: 20px;

      box-shadow:
        inset 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .progress {
      width: 0;

      height: 100%;

      border-radius: 20px;

      transition:
        width 0.7s ease;
    }

    /* FOOTER */

    .footer {
      flex: 0 0 178px;

      display: grid;

      grid-template-columns:
        minmax(200px, 1fr)
        auto
        minmax(200px, 1fr);

      align-items: center;

      gap: 46px;

      padding: 12px 46px;

      background: white;

      border-top:
        1px solid var(--footer-border);
    }

    .footer-block {
      width: 100%;

      text-align: center;
    }

    .footer-block:first-child,
    .footer-block:last-child {
      justify-self: center;
    }

    .footer-label {
      color: var(--muted);

      font-size:
        clamp(11px, 0.85vw, 15px);

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .footer-value {
      margin-top: 3px;

      color: var(--navy);

      font-size:
        clamp(24px, 2vw, 36px);

      font-weight: 800;
    }

    .leader {
      color: var(--navy);
    }

    /* QR AND DIRECT VOTING LINK */

    .qr-block {
      display: flex;

      align-items: center;

      gap: 18px;
    }

    .qr-image-link {
      display: block;

      flex: 0 0 auto;

      border-radius: 12px;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .qr-image-link:hover,
    .qr-image-link:focus-visible {
      transform:
        translateY(-2px);

      outline: none;

      box-shadow:
        0 7px 22px rgba(23, 63, 97, 0.18);
    }

    .qr-code {
      display: block;

      width: 145px;

      height: 145px;

      padding: 5px;

      object-fit: contain;

      background: white;

      border-radius: 12px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.12);
    }

    .qr-copy {
      max-width: 250px;

      text-align: left;
    }

    .qr-title {
      color: var(--navy);

      font-size:
        clamp(20px, 1.55vw, 28px);

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .qr-subtitle {
      margin-top: 4px;

      color: #756d69;

      font-size:
        clamp(13px, 1vw, 18px);

      line-height: 1.3;
    }

    .vote-link {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      margin-top: 10px;

      padding: 8px 15px;

      color: white;

      background: var(--navy);

      border:
        1px solid var(--navy);

      border-radius: 999px;

      font-size:
        clamp(12px, 0.9vw, 15px);

      font-weight: 700;

      line-height: 1;

      text-decoration: none;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .vote-link:hover,
    .vote-link:focus-visible {
      color: var(--navy);

      background: white;

      outline: none;

      transform:
        translateY(-1px);
    }

    /* STATUS: HIDDEN UNLESS THERE IS A CONNECTION ERROR */

    .status {
      display: none;

      position: fixed;

      right: 14px;

      bottom: 12px;

      z-index: 100;
    }

    .status.error {
      display: block;

      padding: 8px 12px;

      color: #7a2530;

      background:
        rgba(255, 255, 255, 0.96);

      border:
        1px solid rgba(122, 37, 48, 0.18);

      border-radius: 8px;

      font-size: 13px;

      font-weight: 700;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.10);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    .mobile-copy {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 700px),
           (max-height: 520px) and (max-width: 950px) {
      html,
      body {
        width: 100%;
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .dashboard {
        width: 100%;
        height: auto;
        min-height: 100svh;
      }

      .header {
        padding: 16px 14px 14px;
      }

      .baby-name {
        font-size: 23px;
      }

      .title {
        max-width: 390px;
        margin-right: auto;
        margin-left: auto;
        font-size: clamp(39px, 11.5vw, 52px);
        line-height: 0.96;
      }

      .subtitle {
        margin-top: 8px;
        font-size: 16px;
      }

      .vote-area {
        flex: none;
        display: block;
        min-height: 0;
      }

      .team {
        width: 100%;
        min-height: 0;
        padding: 40px 18px 44px;
      }

      .baby-photo-card {
        flex: 0 0 auto;
        margin-bottom: 12px;
      }

      .baby-photo-frame {
        flex: 0 0 auto;
        width: min(46vw, 190px);
        height: auto;
        aspect-ratio: 1 / 1;
        border-width: 5px;
      }

      .baby-photo-label {
        margin-top: 9px;
        font-size: 20px;
      }

      .team-label {
        font-size: clamp(30px, 9vw, 40px);
        letter-spacing: 3px;
      }

      .vote-count {
        margin-top: 12px;
        font-size: 96px;
      }

      .votes-label {
        font-size: 14px;
      }

      .percentage {
        font-size: 32px;
      }

      .progress-container {
        width: min(84%, 360px);
        margin-top: 14px;
      }

      .footer {
        flex: none;
        width: 100%;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px 12px;
        padding: 28px 18px max(36px, env(safe-area-inset-bottom));
      }

      .footer-block {
        flex: 0 0 auto;
        width: 100%;
      }

      .footer-block:first-child {
        grid-column: 1;
        grid-row: 2;
      }

      .footer-block:last-child {
        grid-column: 2;
        grid-row: 2;
      }

      .footer-label {
        font-size: 12px;
      }

      .footer-value {
        font-size: clamp(24px, 7vw, 30px);
        line-height: 1.08;
      }

      .qr-block {
        grid-column: 1 / -1;
        grid-row: 1;
        flex: 0 0 auto;
        width: 100%;
        flex-direction: column;
        gap: 10px;
      }

      .qr-image-link {
        display: none;
      }

      .qr-copy {
        width: 100%;
        max-width: 340px;
        text-align: center;
      }

      .desktop-copy {
        display: none;
      }

      .mobile-copy {
        display: inline;
      }

      .qr-title {
        font-size: 26px;
      }

      .qr-subtitle {
        margin-top: 6px;
        font-size: 16px;
      }

      .vote-link {
        min-width: 230px;
        min-height: 46px;
        margin-top: 13px;
        padding: 12px 22px;
        font-size: 16px;
      }

      .status.error {
        right: 10px;
        bottom: 10px;
        left: 10px;
        text-align: center;
      }
    }

    @media print {
      html,
      body {
        height: auto;
        overflow: visible;
      }

      .dashboard {
        height: auto;
        min-height: 0;
      }

      .vote-area {
        display: block;
      }

      .team,
      .footer {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <main class="dashboard">

    <header class="header">

      <div class="baby-name">
        Baby Courtney
      </div>

      <h1 class="title">
        What's Your Prediction?
      </h1>

      <div class="subtitle">
        Boy or Girl? Cast Your Vote!
      </div>

    </header>


    <section class="vote-area">

      <!-- BOY -->

      <div class="team boy">

        <div class="baby-photo-card">

          <div class="baby-photo-frame">
            <img
              src="dad-baby.JPEG?v=4"
              alt="Dad as a baby"
            >
          </div>

          <div class="baby-photo-label">
            Dad as a Baby
          </div>

        </div>

        <div class="team-label">
          Team Boy
        </div>

        <div
          class="vote-count"
          id="boyCount"
        >
          0
        </div>

        <div class="votes-label">
          Votes
        </div>

        <div
          class="percentage"
          id="boyPercent"
        >
          0%
        </div>

        <div class="progress-container">

          <div
            class="progress"
            id="boyProgress"
          ></div>

        </div>

      </div>


      <!-- GIRL -->

      <div class="team girl">

        <div class="baby-photo-card">

          <div class="baby-photo-frame">
            <img
              src="mom-baby.jpg?v=3"
              alt="Mom as a baby"
            >
          </div>

          <div class="baby-photo-label">
            Mom as a Baby
          </div>

        </div>

        <div class="team-label">
          Team Girl
        </div>

        <div
          class="vote-count"
          id="girlCount"
        >
          0
        </div>

        <div class="votes-label">
          Votes
        </div>

        <div
          class="percentage"
          id="girlPercent"
        >
          0%
        </div>

        <div class="progress-container">

          <div
            class="progress"
            id="girlProgress"
          ></div>

        </div>

      </div>

    </section>


    <footer class="footer">

      <!-- TOTAL -->

      <div class="footer-block">

        <div class="footer-label">
          Predictions Cast
        </div>

        <div
          class="footer-value"
          id="totalCount"
        >
          0
        </div>

      </div>


      <!-- QR CODE AND DESKTOP LINK -->

      <div class="qr-block">

        <a
          class="qr-image-link"
          href="https://forms.gle/dVeoDoYPM2qgviJa9"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open the Baby Courtney prediction form"
        >
          <img
            class="qr-code"
            src="vote-qr.png?v=2"
            alt="Scan to cast your gender prediction"
          >
        </a>

        <div class="qr-copy">

          <div class="qr-title">
            <span class="desktop-copy">Scan to Vote</span>
            <span class="mobile-copy">Cast Your Vote</span>
          </div>

          <div class="qr-subtitle">
            Boy or girl?<br>
            Cast your prediction!
          </div>

          <a
            class="vote-link"
            href="https://forms.gle/dVeoDoYPM2qgviJa9"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open Voting Form
          </a>

        </div>

      </div>


      <!-- STATUS OR LEADER -->

      <div class="footer-block">

        <div
          class="footer-label"
          id="leaderLabel"
        >
          Voting Status
        </div>

        <div
          class="footer-value leader"
          id="leader"
        >
          Voting Is Open
        </div>

      </div>

    </footer>

  </main>


  <div
    class="status"
    id="status"
    role="status"
    aria-live="polite"
  ></div>


  <script>
    const API_URL =
      'https://baby-courtney-vote-api.tripods-timbre-2h.workers.dev';

    const REFRESH_INTERVAL =
      3000;


    async function loadVotes() {

      try {

        const separator =
          API_URL.includes('?')
            ? '&'
            : '?';


        const url =
          API_URL +
          separator +
          '_=' +
          Date.now();


        const response =
          await fetch(
            url,
            {
              cache: 'no-store'
            }
          );


        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }


        const data =
          await response.json();


        const boy =
          Number(data.boy) || 0;


        const girl =
          Number(data.girl) || 0;


        const total =
          Number(data.total) ||
          boy + girl;


        const boyPercent =
          total
            ? Math.round(
                (boy / total) * 100
              )
            : 0;


        const girlPercent =
          total
            ? 100 - boyPercent
            : 0;


        updateDashboard({
          boy,
          girl,
          total,
          boyPercent,
          girlPercent
        });


        const status =
          document.getElementById(
            'status'
          );


        status.textContent =
          '';


        status.className =
          'status';

      }

      catch (error) {

        console.error(
          'Vote refresh failed:',
          error
        );


        const status =
          document.getElementById(
            'status'
          );


        status.textContent =
          'Connection lost. Reconnecting...';


        status.className =
          'status error';

      }

    }


    function updateDashboard(data) {

      setText(
        'boyCount',
        data.boy
      );


      setText(
        'girlCount',
        data.girl
      );


      setText(
        'totalCount',
        data.total
      );


      setText(
        'boyPercent',
        data.boyPercent + '%'
      );


      setText(
        'girlPercent',
        data.girlPercent + '%'
      );


      document
        .getElementById(
          'boyProgress'
        )
        .style.width =
          data.boyPercent + '%';


      document
        .getElementById(
          'girlProgress'
        )
        .style.width =
          data.girlPercent + '%';


      let leaderLabel =
        'Voting Status';


      let leaderText =
        'Voting Is Open';


      if (data.total > 0) {

        leaderLabel =
          'Current Leader';


        if (
          data.boy >
          data.girl
        ) {

          const difference =
            data.boy -
            data.girl;


          leaderText =
            'Team Boy +' +
            difference;

        }

        else if (
          data.girl >
          data.boy
        ) {

          const difference =
            data.girl -
            data.boy;


          leaderText =
            'Team Girl +' +
            difference;

        }

        else {

          leaderText =
            "It's a Tie!";

        }

      }


      setText(
        'leaderLabel',
        leaderLabel
      );


      setText(
        'leader',
        leaderText
      );

    }


    function setText(
      id,
      value
    ) {

      document
        .getElementById(id)
        .textContent =
          value;

    }


    loadVotes();


    setInterval(
      loadVotes,
      REFRESH_INTERVAL
    );
  </script>

</body>
</html>
