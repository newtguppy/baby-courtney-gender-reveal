<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Baby Courtney Gender Prediction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #fffaf7;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .dashboard {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      text-align: center;

      background:
        linear-gradient(
          90deg,
          rgba(219, 239, 255, 0.96),
          rgba(255, 255, 255, 0.98) 50%,
          rgba(255, 224, 235, 0.96)
        );

      padding: 18px 30px 15px;

      border-bottom:
        1px solid rgba(0, 0, 0, 0.05);
    }

    .baby-name {
      font-family:
        Georgia,
        'Times New Roman',
        serif;

      color: #173f61;

      font-size:
        clamp(22px, 2vw, 38px);

      margin-bottom: 3px;
    }

    .title {
      margin: 0;

      font-family:
        Georgia,
        'Times New Roman',
        serif;

      font-size:
        clamp(38px, 4.2vw, 76px);

      color: #173f61;

      line-height: 1.02;
    }

    .subtitle {
      margin-top: 7px;

      font-size:
        clamp(16px, 1.5vw, 26px);

      color: #766b65;
    }

    /* MAIN */

    .vote-area {
      flex: 1;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      min-height: 0;
    }

    .team {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      position: relative;

      padding: 22px 28px;
    }

    /* BOY */

    .boy {
      background:
        radial-gradient(
          circle at 50% 30%,
          #f9fdff 0%,
          #e7f5ff 48%,
          #d2edff 100%
        );
    }

    .boy .team-label {
      color: #2787c4;
    }

    .boy .vote-count {
      color: #1479b9;
    }

    .boy .progress {
      background: #278dcc;
    }

    /* GIRL */

    .girl {
      background:
        radial-gradient(
          circle at 50% 30%,
          #fffafd 0%,
          #fff0f5 48%,
          #ffdae7 100%
        );
    }

    .girl .team-label {
      color: #df7195;
    }

    .girl .vote-count {
      color: #d95e88;
    }

    .girl .progress {
      background: #df7195;
    }

    /* BABY PHOTO CARDS */

    .baby-photo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }

    .baby-photo-frame {
      width: clamp(95px, 8vw, 145px);
      height: clamp(95px, 8vw, 145px);

      border-radius: 50%;
      overflow: hidden;

      background: white;

      border:
        5px solid rgba(255, 255, 255, 0.95);

      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.13);
    }

    .baby-photo-frame img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center 30%;

      display: block;
    }

    .baby-photo-label {
      margin-top: 8px;

      font-family:
        Georgia,
        'Times New Roman',
        serif;

      font-size:
        clamp(14px, 1.1vw, 20px);

      font-style: italic;

      color: #716661;
    }

    .boy .baby-photo-frame {
      box-shadow:
        0 8px 22px rgba(39, 135, 196, 0.20);
    }

    .girl .baby-photo-frame {
      box-shadow:
        0 8px 22px rgba(223, 113, 149, 0.24);
    }

    /* DAD PLACEHOLDER */

    .dad-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #f9fdff,
          #dcefff
        );

      font-size:
        clamp(38px, 4vw, 62px);
    }

    /* TEAM CONTENT */

    .team-label {
      font-size:
        clamp(27px, 2.6vw, 48px);

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 4px;
    }

    .vote-count {
      font-size:
        clamp(90px, 11vw, 205px);

      font-weight: 800;

      line-height: 0.88;

      margin: 12px 0 6px;
    }

    .votes-label {
      text-transform: uppercase;

      letter-spacing: 3px;

      color: #756d69;

      font-size:
        clamp(13px, 1.2vw, 21px);
    }

    .percentage {
      margin-top: 8px;

      font-size:
        clamp(27px, 2.5vw, 45px);

      font-weight: 700;

      color: #504845;
    }

    /* PROGRESS */

    .progress-container {
      width:
        min(72%, 520px);

      height: 15px;

      margin-top: 16px;

      border-radius: 20px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.8);

      box-shadow:
        inset 0 1px 4px
        rgba(0, 0, 0, 0.08);
    }

    .progress {
      height: 100%;

      width: 0%;

      border-radius: 20px;

      transition:
        width 0.7s ease;
    }

    /* FOOTER */

    .footer {
      background: white;

      min-height: 84px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 90px;

      padding: 12px 30px;

      border-top:
        1px solid #eee7e2;
    }

    .footer-block {
      text-align: center;
    }

    .footer-label {
      color: #82766f;

      text-transform: uppercase;

      letter-spacing: 2px;

      font-size:
        clamp(11px, 0.9vw, 16px);
    }

    .footer-value {
      color: #173f61;

      font-weight: 800;

      font-size:
        clamp(24px, 2.1vw, 38px);

      margin-top: 3px;
    }

    .leader {
      color: #625853;
    }

    /* STATUS */

    .status {
      position: fixed;

      bottom: 5px;

      right: 8px;

      color: #aaa;

      font-size: 9px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      body {
        overflow: auto;
      }

      .vote-area {
        grid-template-columns: 1fr;
      }

      .team {
        min-height: 420px;
      }

      .footer {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="dashboard">

    <header class="header">

      <div class="baby-name">
        Baby Courtney
      </div>

      <h1 class="title">
        What's Your Prediction?
      </h1>

      <div class="subtitle">
        Boy or Girl? Cast Your Vote!
      </div>

    </header>


    <section class="vote-area">

      <!-- BOY -->

      <div class="team boy">

        <div class="baby-photo-card">

          <div class="baby-photo-frame">
            <div class="dad-placeholder">
              💙
            </div>
          </div>

          <div class="baby-photo-label">
            Dad as a Baby
          </div>

        </div>

        <div class="team-label">
          Team Boy
        </div>

        <div
          class="vote-count"
          id="boyCount"
        >
          0
        </div>

        <div class="votes-label">
          Votes
        </div>

        <div
          class="percentage"
          id="boyPercent"
        >
          0%
        </div>

        <div class="progress-container">

          <div
            class="progress"
            id="boyProgress"
          ></div>

        </div>

      </div>


      <!-- GIRL -->

      <div class="team girl">

        <div class="baby-photo-card">

          <div class="baby-photo-frame">
            <img
              src="mom-baby.jpg"
              alt="Mom as a baby"
            >
          </div>

          <div class="baby-photo-label">
            Mom as a Baby
          </div>

        </div>

        <div class="team-label">
          Team Girl
        </div>

        <div
          class="vote-count"
          id="girlCount"
        >
          0
        </div>

        <div class="votes-label">
          Votes
        </div>

        <div
          class="percentage"
          id="girlPercent"
        >
          0%
        </div>

        <div class="progress-container">

          <div
            class="progress"
            id="girlProgress"
          ></div>

        </div>

      </div>

    </section>


    <footer class="footer">

      <div class="footer-block">

        <div class="footer-label">
          Predictions Cast
        </div>

        <div
          class="footer-value"
          id="totalCount"
        >
          0
        </div>

      </div>


      <div class="footer-block">

        <div class="footer-label">
          Current Leader
        </div>

        <div
          class="footer-value leader"
          id="leader"
        >
          Waiting for votes
        </div>

      </div>

    </footer>

  </main>


  <div
    class="status"
    id="status"
  >
    Connecting...
  </div>


  <script>

    /*
     * REPLACE THIS VALUE WITH YOUR
     * ACTUAL CLOUDFLARE WORKER URL.
     */

    const API_URL =
      'https://baby-courtney-vote-api.tripods-timbre-2h.workers.dev/';


    /*
     * Check the API every 3 seconds.
     */

    const REFRESH_INTERVAL =
      3000;


    async function loadVotes() {

      try {

        const separator =
          API_URL.includes('?')
            ? '&'
            : '?';


        const url =
          API_URL +
          separator +
          '_=' +
          Date.now();


        const response =
          await fetch(
            url,
            {
              cache: 'no-store'
            }
          );


        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }


        const data =
          await response.json();


        const boy =
          Number(data.boy) || 0;


        const girl =
          Number(data.girl) || 0;


        const total =
          Number(data.total) ||
          boy + girl;


        const boyPercent =
          total
            ? Math.round(
                (boy / total) * 100
              )
            : 0;


        const girlPercent =
          total
            ? 100 - boyPercent
            : 0;


        updateDashboard({
          boy,
          girl,
          total,
          boyPercent,
          girlPercent
        });


        document
          .getElementById('status')
          .textContent =
            'Updated ' +
            new Date()
              .toLocaleTimeString();

      }

      catch (error) {

        console.error(
          'Vote refresh failed:',
          error
        );


        document
          .getElementById('status')
          .textContent =
            'Connection error';

      }

    }


    function updateDashboard(data) {

      setText(
        'boyCount',
        data.boy
      );


      setText(
        'girlCount',
        data.girl
      );


      setText(
        'totalCount',
        data.total
      );


      setText(
        'boyPercent',
        data.boyPercent + '%'
      );


      setText(
        'girlPercent',
        data.girlPercent + '%'
      );


      document
        .getElementById(
          'boyProgress'
        )
        .style.width =
          data.boyPercent + '%';


      document
        .getElementById(
          'girlProgress'
        )
        .style.width =
          data.girlPercent + '%';


      let leaderText =
        'Waiting for votes';


      if (data.total > 0) {

        if (
          data.boy >
          data.girl
        ) {

          const difference =
            data.boy -
            data.girl;


          leaderText =
            'Team Boy +' +
            difference;

        }

        else if (
          data.girl >
          data.boy
        ) {

          const difference =
            data.girl -
            data.boy;


          leaderText =
            'Team Girl +' +
            difference;

        }

        else {

          leaderText =
            "It's a Tie!";

        }

      }


      setText(
        'leader',
        leaderText
      );

    }


    function setText(
      id,
      value
    ) {

      document
        .getElementById(id)
        .textContent =
          value;

    }


    loadVotes();


    setInterval(
      loadVotes,
      REFRESH_INTERVAL
    );

  </script>

</body>
</html>
